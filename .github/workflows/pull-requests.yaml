name: PR build

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify semver label is set for this PR
        uses: mheap/github-action-required-labels@v5.6.0
        with:
          mode: exactly
          count: 1
          labels: "patch, minor, major"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Build, lint and test
        run: ./gradlew check build
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: "*/build/reports/"
          retention-days: 7
