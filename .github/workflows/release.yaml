name: Release (GitHub Package Registry)

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore: [.github/dependabot.yaml]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - id: bump
        uses: zwaldowski/match-label-action@v6
        with:
          allowed: major,minor,patch
      - id: next_version
        name: Tag release with semver
        uses: zwaldowski/semver-release-action@v6
        with:
          bump: ${{ steps.bump.outputs.match }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: ./gradlew -Pversion="$VERSION" check publish
        env:
          VERSION: ${{ steps.next_version.outputs.version_tag }}
          GITHUB_USERNAME: x-access-token
          GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.next_version.outputs.version_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
